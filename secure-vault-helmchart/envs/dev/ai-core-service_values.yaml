microservices:
  ai-core-service:
    enabled: true
    port: 8001
    servicePort: 8001
    image:
      repo: kittuvittu/secure-vault-ai-core-service
    ingress:
      path: /ai-core
      # Traefik StripPrefix Middleware — FastAPI routers are mounted at the
      # root (/embed, /search, /chat, /rag), so /ai-core/* must be stripped
      # before reaching the pod.
      stripPrefix: true
    env:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8001"
      POSTGRES_HOST: "$(HOST_IP)"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "digital-notes"
      POSTGRES_USER: "postgres"
      POSTGRES_SCHEMA: "ai_core"
      CHAT_PROVIDER: "openai"
      EMBED_PROVIDER: "gemini"
      # Chat is served by OpenRouter (the OPENAI_API_KEY secret is an
      # OpenRouter sk-or-... key). Without these two, ai-core falls back to
      # config.py defaults (api.openai.com + gpt-4o-mini) and sends the
      # OpenRouter key to OpenAI, which 401s with "Incorrect API key".
      OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_CHAT_MODEL: "openai/gpt-oss-120b"
      CORS_ALLOWED_ORIGINS: "https://secure-vault-dev.cntrlflix.com"
    secretEnv:
      POSTGRES_PASSWORD:
        secretName: secure-vault-db
        key: password
      JWT_SECRET:
        secretName: secure-vault-jwt
        key: secret
      GEMINI_API_KEY:
        secretName: secure-vault-ai
        key: geminiApiKey
      OPENAI_API_KEY:
        secretName: secure-vault-ai
        key: openaiApiKey
    probes:
      readiness:
        httpGet:
          path: /health
        initialDelaySeconds: 15
      liveness:
        httpGet:
          path: /health
        initialDelaySeconds: 40
    resources:
      requests:
        cpu: "150m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
