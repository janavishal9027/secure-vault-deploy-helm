microservices:
  ai-worker-service:
    enabled: true
    port: 8000
    servicePort: 8000
    image:
      repo: kittuvittu/secure-vault-ai-worker
    ingress:
      path: /ai-worker
      stripPrefix: true
    env:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      # ai-worker uses an OpenAI-compatible client (AsyncOpenAI) pointed at
      # OpenRouter — it reads OPENAI_* env vars, NOT GEMINI_*. Injecting
      # GEMINI_* leaves openai_api_key="" (pydantic extra="ignore"), so
      # /summarize raises "OPENAI_API_KEY is not configured".
      OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_MODEL: "openai/gpt-oss-120b"
      SUMMARY_CHUNK_THRESHOLD_CHARS: "8000"
      SUMMARY_CHUNK_SIZE_CHARS: "6000"
      SUMMARY_MAX_CONCURRENT_CHUNKS: "4"
    secretEnv:
      OPENAI_API_KEY:
        secretName: secure-vault-ai
        key: openaiApiKey
    probes:
      readiness:
        httpGet:
          path: /health
        initialDelaySeconds: 10
      liveness:
        httpGet:
          path: /health
        initialDelaySeconds: 30
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "750m"
        memory: "512Mi"
